name: ACG Continuous Integration & Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Build, Test & Security Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check & Production Build
        run: npm run build

      - name: Automated Unit & Integration Tests (Vitest)
        run: npm test

      - name: Live Adversarial Penetration Suite
        run: npm run pentest

      - name: Cryptographic Audit Ledger Integrity Verification
        run: npm run audit:verify

      - name: Cold-Start Performance Benchmark
        run: npm run benchmark
