name: CI & Quality Assurance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck & Build
        run: npm run build

      - name: Run Test Suite (Vitest)
        run: npm test

      - name: Run Simulation Demo
        run: npm run demo

      - name: Run Live Penetration Tests
        run: npm run pentest
