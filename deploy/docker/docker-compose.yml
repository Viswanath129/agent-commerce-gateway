version: "3.8"

services:
  gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: agent-commerce-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ../../.env
    volumes:
      - gateway-data:/app/data

volumes:
  gateway-data:
