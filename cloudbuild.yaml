steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/acg-gateway:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/acg-gateway:latest', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/acg-gateway:$COMMIT_SHA']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/acg-gateway:latest']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'acg-gateway'
      - '--image'
      - 'gcr.io/$PROJECT_ID/acg-gateway:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '3000'
      - '--set-env-vars'
      - 'NODE_ENV=production,PORT=3000,HOST=0.0.0.0'

images:
  - 'gcr.io/$PROJECT_ID/acg-gateway:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/acg-gateway:latest'
